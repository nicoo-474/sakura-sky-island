/* =========================================================================
   C. 植被：草 / 花 / 樱树 / 落花
   ========================================================================= */

/* ---------- 是否避让 ---------- */
function excluded(x, z, pad) {
  pad = pad || 0;
  for (let i = 0; i < EXCLUDE.length; i++) {
    const e = EXCLUDE[i];
    const dx = x - e.x, dz = z - e.z;
    if (dx * dx + dz * dz < (e.r + pad) * (e.r + pad)) return true;
  }
  return false;
}
function nearPath(x, z, pad) {
  let best = 1e9;
  for (let i = 0; i < PATH_SAMPLES.length; i++) {
    const p = PATH_SAMPLES[i];
    const dx = x - p.x, dz = z - p.z;
    const d = dx * dx + dz * dz;
    if (d < best) best = d;
  }
  return best < pad * pad;
}

/* ========================================================================
   C1. 草：一簇多叶的草丛（实例化 + 顶点风场）
   ======================================================================== */
function makeTuftGeo(nb, segs, seed) {
  const pos = [], idx = [], cols = [];
  const r = mulberry32(seed || 7);
  const W0 = 0.030;
  for (let b = 0; b < nb; b++) {
    const oa = r() * TAU, orr = Math.pow(r(), 0.6) * 0.085;
    const ox = Math.cos(oa) * orr, oz = Math.sin(oa) * orr;
    const yaw = r() * TAU;
    const lean = 0.12 + r() * 0.45;
    const hh = 0.72 + r() * 0.55;
    const dx = Math.cos(yaw), dz = Math.sin(yaw);
    const px = -dz, pz = dx;
    const base = pos.length / 3;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const w = W0 * Math.pow(1 - t, 0.45) + 0.0026;
      const bend = Math.pow(t, 1.9) * 0.34 * lean;
      const cx = ox + dx * bend, cz = oz + dz * bend, cy = t * hh;
      pos.push(cx - px * w, cy, cz - pz * w, cx + px * w, cy, cz + pz * w);
      const c = 0.60 + 0.52 * Math.pow(t, 0.5);
      cols.push(c, c, c, c, c, c);
    }
    for (let i = 0; i < segs; i++) {
      const a = base + i * 2, bq = a + 1, c2 = a + 2, d = a + 3;
      idx.push(a, bq, c2, bq, d, c2);
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  const v = new T.Vector3();
  for (let i = 0; i < nrm.count; i++) {
    v.set(nrm.getX(i) * 0.42, 1.0, nrm.getZ(i) * 0.42).normalize();
    nrm.setXYZ(i, v.x, v.y, v.z);
  }
  return g;
}

const grassMat = new T.MeshStandardMaterial({
  color: new T.Color(PAL.grass), vertexColors: true, side: T.DoubleSide,
  roughness: 0.88, metalness: 0.0,
});
windifyGrass(grassMat);

const GRASS = [];
function addTuft(x, z, h, yaw, tilt) {
  if (GRASS.length > 15000) return;
  GRASS.push({ x, z, h, yaw: yaw === undefined ? rnd(0, TAU) : yaw, phase: rnd(0, TAU), tilt: tilt || 0 });
}

function buildGrass() {
  RNG = mulberry32(90901);

  /* 1) 边缘草丛带：茂密、朝外披挂 */
  for (let i = 0; i < 7200; i++) {
    const a = rnd(0, TAU);
    const R = islandRadius(a);
    const rn = 0.902 + Math.pow(rnd(0, 1), 0.5) * 0.108;
    const r = rn * R;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (excluded(x, z, 0.1)) continue;
    const h = (0.54 + Math.pow(rnd(0, 1), 1.2) * 0.70);
    const out = smoothstep(0.93, 1.0, rn);
    addTuft(x, z, h, a + Math.PI * 0.5 + rnd(-0.5, 0.5), out * rnd(0.6, 1.15));
  }

  /* 2) 岛内草坪：成组草簇，留出厚涂地面 */
  let tries = 0, groups = 0;
  while (groups < 620 && tries < 40000) {
    tries++;
    const a = rnd(0, TAU);
    const R = islandRadius(a) * 0.875;
    const r = Math.sqrt(rnd(0, 1)) * R;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const density = fbm(x * 0.20 + 11, z * 0.20 - 4, 3, 55);
    if (rnd(0, 1) > 0.30 + density * 0.95) continue;
    if (excluded(x, z, 0.12)) continue;
    if (nearPath(x, z, 0.85)) continue;
    groups++;
    const n = 2 + Math.floor(rnd(0, 0.99) * 4);
    const gs = 0.34 + rnd(0, 0.30);
    for (let k = 0; k < n; k++) {
      const aa = rnd(0, TAU), rr = Math.sqrt(rnd(0, 1)) * gs;
      const bx = x + Math.cos(aa) * rr, bz = z + Math.sin(aa) * rr;
      if (excluded(bx, bz, 0.06)) continue;
      addTuft(bx, bz, 0.26 + Math.pow(rnd(0, 1), 1.4) * 0.42);
    }
  }

  /* 3) 树根与石边丛草 */
  TREE_SPOTS.forEach((t) => {
    for (let i = 0; i < 260; i++) {
      const a = rnd(0, TAU), r = Math.sqrt(rnd(0, 1)) * 1.5 * t.s;
      const x = t.x + Math.cos(a) * r, z = t.z + Math.sin(a) * r;
      if (excluded(x, z, 0.05)) continue;
      addTuft(x, z, 0.26 + rnd(0, 0.34));
    }
  });

  const geo = makeTuftGeo(6, 4, 3131);
  const rotArr = new Float32Array(GRASS.length);
  const phArr = new Float32Array(GRASS.length);
  const mesh = new T.InstancedMesh(geo, grassMat, GRASS.length);
  mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
  const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), sc = new T.Vector3(), pv = new T.Vector3();
  const col = new T.Color();
  for (let i = 0; i < GRASS.length; i++) {
    const b = GRASS[i];
    const y = groundH(b.x, b.z) - 0.04 - b.tilt * 0.05;
    pv.set(b.x, y, b.z);
    e.set(-b.tilt * 0.55, b.yaw, 0, 'YXZ');
    q.setFromEuler(e);
    const w = 0.62 + b.h * 0.55;
    sc.set(w, b.h, w);
    m4.compose(pv, q, sc);
    mesh.setMatrixAt(i, m4);
    rotArr[i] = b.yaw;
    phArr[i] = b.phase;
    const tone = 0.72 + Math.pow(hash2(i * 7, i * 13, 3), 1.6) * 0.58;
    col.setRGB(tone, tone, tone);
    mesh.setColorAt(i, col);
  }
  geo.setAttribute('aRot', new T.InstancedBufferAttribute(rotArr, 1));
  geo.setAttribute('aPhase', new T.InstancedBufferAttribute(phArr, 1));
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

/* ========================================================================
   C2. 小花（单色）
   ======================================================================== */
function makeFlowerGeo() {
  const pos = [], idx = [];
  const push = (v) => { pos.push(v[0], v[1], v[2]); return pos.length / 3 - 1; };
  // 茎
  const stemTop = 0.17;
  const b0 = push([-0.008, 0, 0]), b1 = push([0.008, 0, 0]), b2 = push([0.004, stemTop, 0]), b3 = push([-0.004, stemTop, 0]);
  idx.push(b0, b1, b2, b0, b2, b3);
  // 五瓣
  const headY = stemTop;
  const petalR = 0.046;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * TAU + 0.3;
    const ca = Math.cos(a), sa = Math.sin(a);
    const na = a + Math.PI / 2;
    const w = 0.030;
    const c = push([0, headY, 0]);
    const p1 = push([ca * petalR + Math.cos(na) * w, headY + 0.030, sa * petalR + Math.sin(na) * w]);
    const p2 = push([ca * petalR * 1.12, headY + 0.014, sa * petalR * 1.12]);
    const p3 = push([ca * petalR - Math.cos(na) * w, headY + 0.030, sa * petalR - Math.sin(na) * w]);
    idx.push(c, p1, p2, c, p2, p3);
  }
  // 花心
  const cc = push([0, headY + 0.022, 0]);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * TAU;
    const b = (i + 1) / 5 * TAU;
    const q1 = push([Math.cos(a) * 0.022, headY + 0.026, Math.sin(a) * 0.022]);
    const q2 = push([Math.cos(b) * 0.022, headY + 0.026, Math.sin(b) * 0.022]);
    idx.push(cc, q1, q2);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildFlowers() {
  RNG = mulberry32(4242);
  const pts = [];
  let tries = 0;
  while (pts.length < 1100 && tries < 40000) {
    tries++;
    const a = rnd(0, TAU);
    const R = islandRadius(a) * 0.86;
    const r = Math.sqrt(rnd(0, 1)) * R;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    // 成片分布
    const patch = fbm(x * 0.42 - 3, z * 0.42 + 8, 3, 77);
    if (rnd(0, 1) > Math.pow(patch, 2.2) * 2.1) continue;
    if (excluded(x, z, 0.15)) continue;
    if (nearPath(x, z, 1.25)) continue;
    pts.push({ x, z, s: 0.75 + rnd(0, 0.85) });
  }
  const geo = makeFlowerGeo();
  const mat = new T.MeshStandardMaterial({
    color: new T.Color('#ffe9f1'), roughness: 0.72, metalness: 0.0, side: T.DoubleSide,
    emissive: new T.Color('#ffdcea'), emissiveIntensity: 0.0,
  });
  windifyGrass(mat);
  const mesh = new T.InstancedMesh(geo, mat, pts.length);
  const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), sc = new T.Vector3(), pv = new T.Vector3();
  const rotArr = new Float32Array(pts.length), phArr = new Float32Array(pts.length);
  pts.forEach((p, i) => {
    pv.set(p.x, groundH(p.x, p.z) - 0.01, p.z);
    const yaw = rnd(0, TAU);
    e.set(rnd(-0.09, 0.09), yaw, rnd(-0.09, 0.09), 'YXZ');
    q.setFromEuler(e);
    sc.setScalar(p.s);
    m4.compose(pv, q, sc);
    mesh.setMatrixAt(i, m4);
    rotArr[i] = yaw;
    phArr[i] = rnd(0, TAU);
  });
  geo.setAttribute('aRot', new T.InstancedBufferAttribute(rotArr, 1));
  geo.setAttribute('aPhase', new T.InstancedBufferAttribute(phArr, 1));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return { mesh, mat };
}

/* ========================================================================
   C3. 樱花树
   ======================================================================== */
const TREE_SPOTS = [];
const CANOPY_PTS = [];
const leafVerts = { pos: [], nrm: [], uv: [], idx: [], sway: [], phase: [], col: [] };

function addLeafCard(cx, cy, cz, nx, ny, nz, size, swayV, phase, tone) {
  tone = tone === undefined ? 1 : tone;
  const fwd = new T.Vector3(nx, ny, nz).normalize();
  const upHint = Math.abs(fwd.y) > 0.9 ? new T.Vector3(1, 0, 0) : new T.Vector3(0, 1, 0);
  const right = new T.Vector3().crossVectors(upHint, fwd).normalize();
  const up2 = new T.Vector3().crossVectors(fwd, right).normalize();
  const base = leafVerts.pos.length / 3;
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (let k = 0; k < 4; k++) {
    const sx = corners[k][0] * size * 0.5, sy = corners[k][1] * size * 0.5;
    const px = cx + right.x * sx + up2.x * sy;
    const py = cy + right.y * sx + up2.y * sy;
    const pz = cz + right.z * sx + up2.z * sy;
    leafVerts.pos.push(px, py, pz);
    // 球形法线：从团簇中心向外
    const dx = px - cx, dy = py - cy, dz = pz - cz;
    const len = Math.hypot(dx, dy, dz) || 1;
    leafVerts.nrm.push(dx / len * 0.30 + fwd.x * 0.50, dy / len * 0.30 + fwd.y * 0.50 + 0.62, dz / len * 0.30 + fwd.z * 0.50);
    leafVerts.uv.push(k === 0 || k === 3 ? 0 : 1, k < 2 ? 0 : 1);
    leafVerts.sway.push(swayV);
    leafVerts.phase.push(phase);
    leafVerts.col.push(tone, tone * 0.94, tone * 0.97);
  }
  leafVerts.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}

/* 叶团：带椭球分布 + 破轮廓的散叶 */
function addCluster(center, radius, dirBias, swayV, r) {
  const n = 13 + Math.floor(r() * 7);
  const cph = r() * TAU;
  const bias = dirBias.clone().normalize();
  for (let i = 0; i < n; i++) {
    // 椭球：沿枝方向压扁
    const th = r() * TAU, ph = Math.acos(2 * r() - 1);
    let vx = Math.sin(ph) * Math.cos(th), vy = Math.cos(ph), vz = Math.sin(ph) * Math.sin(th);
    const along = vx * bias.x + vy * bias.y + vz * bias.z;
    vx -= bias.x * along * 0.45; vy -= bias.y * along * 0.45; vz -= bias.z * along * 0.45;
    const rr = radius * (0.35 + 0.65 * Math.cbrt(r()));
    const px = center.x + vx * rr * 1.12;
    const py = center.y + vy * rr * 0.82;
    const pz = center.z + vz * rr * 1.12;
    let nx = vx + (r() - 0.5) * 0.7, ny = vy + (r() - 0.5) * 0.7 + 0.15, nz = vz + (r() - 0.5) * 0.7;
    const size = radius * (0.72 + r() * 0.55);
    const tone = 0.72 + Math.pow(r(), 0.8) * 0.55;
    addLeafCard(px, py, pz, nx, ny, nz, size, swayV, cph + r() * 0.25, tone);
  }
  // 破形：1~2 片偏大的散叶伸出去
  for (let i = 0; i < 2; i++) {
    const th = r() * TAU, ph = Math.acos(2 * r() - 1);
    const vx = Math.sin(ph) * Math.cos(th), vy = Math.cos(ph), vz = Math.sin(ph) * Math.sin(th);
    const rr = radius * (1.16 + r() * 0.26);
    addLeafCard(
      center.x + vx * rr, center.y + vy * rr * 0.8, center.z + vz * rr,
      vx + (r() - 0.5) * 0.5, vy + 0.35, vz + (r() - 0.5) * 0.5,
      radius * (0.62 + r() * 0.28), swayV * 1.15, cph + r() * 0.25, 0.68 + Math.pow(r(), 1.2) * 0.42
    );
  }
  if (r() < 0.5) CANOPY_PTS.push(center.clone());
}

function buildSakura(cfg) {
  RNG = mulberry32(cfg.seed);
  const r = RNG;
  const branches = [];
  const s = cfg.scale || 1;
  const baseY = cfg.baseY !== undefined ? cfg.baseY : groundH(cfg.x, cfg.z);

  function branchPoints(start, dir, len, bow) {
    const pts = [];
    const n = 5;
    const side = new T.Vector3().crossVectors(dir, new T.Vector3(0, 1, 0));
    if (side.lengthSq() < 1e-5) side.set(1, 0, 0);
    side.normalize();
    const bowV = side.multiplyScalar(bow).add(new T.Vector3(0, bow * 0.45, 0));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const p = start.clone().addScaledVector(dir, len * t).addScaledVector(bowV, Math.sin(t * Math.PI) * 0.55);
      pts.push(p);
    }
    return pts;
  }

  function grow(start, dir, len, rad, depth, swayV) {
    const pts = branchPoints(start, dir, len, (r() - 0.5) * len * 0.30);
    branches.push({ pts, r0: rad, r1: rad * (depth >= 2 ? 0.55 : 0.68) });
    const end = pts[pts.length - 1];
    const endDir = pts[pts.length - 1].clone().sub(pts[pts.length - 2]).normalize();

    if (depth >= cfg.depth) {
      addCluster(end, cfg.leafR * s * (0.85 + r() * 0.35), endDir, swayV, r);
      return;
    }

    // 末级枝干沿途挂叶
    if (depth >= 2) {
      const cnt = depth >= 3 ? 2 : 1;
      for (let i = 0; i < cnt; i++) {
        const t = 0.55 + i * 0.32;
        const p = pts[Math.min(pts.length - 1, Math.round(t * (pts.length - 1)))];
        addCluster(p, cfg.leafR * s * (0.62 + r() * 0.28), endDir, swayV * 0.95, r);
      }
    }

    const kids = depth === 0 ? 3 : (r() < 0.72 ? 2 : 3);
    for (let i = 0; i < kids; i++) {
      const ang = (depth === 0 ? 0.34 : 0.42) + r() * 0.42;
      const roll = (i / kids) * TAU + r() * 0.7;
      let nd = deflect(endDir, ang, roll);
      // 向上/向外的生长偏好
      nd.y += cfg.upBias !== undefined ? cfg.upBias : 0.16;
      if (cfg.weep && depth >= 2) nd.y -= 0.30;
      nd.normalize();
      const spawn = depth === 0 ? pts[Math.round(pts.length * (0.55 + r() * 0.25))] : end;
      grow(spawn, nd, len * (0.66 + r() * 0.18), rad * 0.62, depth + 1, swayV + 0.16);
    }
  }

  function deflect(dir, angle, roll) {
    const up = new T.Vector3(0, 1, 0);
    let side = new T.Vector3().crossVectors(dir, up);
    if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
    side.normalize();
    const fwd = new T.Vector3().crossVectors(side, dir).normalize();
    const axis = side.clone().multiplyScalar(Math.cos(roll)).addScaledVector(fwd, Math.sin(roll)).normalize();
    return dir.clone().applyAxisAngle(axis, angle).normalize();
  }

  // 主干（世界坐标建模，便于叶团与枝干共用同一空间）
  const startDir = new T.Vector3(cfg.leanX || 0, 1, cfg.leanZ || 0).normalize();
  const trunkLen = 2.55 * s;
  grow(new T.Vector3(cfg.x, baseY - 0.05, cfg.z), startDir, trunkLen, 0.30 * s, 0, 0);

  /* 组装枝干网格 */
  const woodGeo = mergeBranches(branches, baseY, r() * TAU);
  const woodMat = new T.MeshStandardMaterial({
    color: new T.Color('#7a5361'), roughness: 0.92, metalness: 0.0, flatShading: true,
  });
  windifyFoliage(woodMat, 0.42);
  const wood = new T.Mesh(woodGeo, woodMat);
  wood.castShadow = true; wood.receiveShadow = true;

  const grp = new T.Group();
  grp.add(wood);
  grp.position.set(0, 0, 0);
  scene.add(grp);

  // 叶团（全局合并）
  TREE_SPOTS.push({ x: cfg.x, z: cfg.z, s: s });
  addExclude(cfg.x, cfg.z, 0.85 * s);
  return grp;
}

/* 把若干锥形管合并成一个几何体 */
function mergeBranches(list, baseY, phase) {
  const pos = [], idx = [], uv = [];
  const R = 8;
  list.forEach((b) => {
    const pts = b.pts;
    const n = pts.length;
    const base = pos.length / 3;
    const frames = [];
    for (let i = 0; i < n; i++) {
      const t = new T.Vector3();
      if (i === 0) t.subVectors(pts[1], pts[0]);
      else if (i === n - 1) t.subVectors(pts[n - 1], pts[n - 2]);
      else t.subVectors(pts[i + 1], pts[i - 1]);
      t.normalize();
      let u = new T.Vector3().crossVectors(new T.Vector3(0, 1, 0), t);
      if (u.lengthSq() < 1e-6) u.crossVectors(new T.Vector3(1, 0, 0), t);
      u.normalize();
      const v = new T.Vector3().crossVectors(t, u).normalize();
      frames.push({ u, v });
    }
    for (let i = 0; i < n; i++) {
      const s = i / (n - 1);
      const rad = b.r0 + (b.r1 - b.r0) * s;
      for (let j = 0; j < R; j++) {
        const a = (j / R) * TAU;
        const k = 1 + 0.07 * Math.sin(i * 2.3 + j * 1.7);
        const p = pts[i].clone()
          .addScaledVector(frames[i].u, Math.cos(a) * rad * k)
          .addScaledVector(frames[i].v, Math.sin(a) * rad * k);
        pos.push(p.x, p.y, p.z);
        uv.push(j / R, s);
      }
    }
    for (let i = 0; i < n - 1; i++) {
      for (let j = 0; j < R; j++) {
        const a = base + i * R + j, bq = base + i * R + ((j + 1) % R);
        const c = base + (i + 1) * R + j, d = base + (i + 1) * R + ((j + 1) % R);
        idx.push(a, bq, c, bq, d, c);
      }
    }
  });
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  const swayArr = new Float32Array(pos.length / 3);
  const phArr = new Float32Array(pos.length / 3);
  for (let i = 0; i < swayArr.length; i++) {
    const y = pos[i * 3 + 1];
    swayArr[i] = Math.pow(clamp((y - baseY) / 6.5, 0, 1), 1.5) * 0.85;
    phArr[i] = phase || 0;
  }
  g.setAttribute('aSway', new T.Float32BufferAttribute(swayArr, 1));
  g.setAttribute('aPhase', new T.Float32BufferAttribute(phArr, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* 垂枝櫻：从枝端垂下的花串 */
function addWeepStrand(start, dir, len, swayV, r, s) {
  const out = dir.clone(); out.y = 0;
  if (out.lengthSq() < 1e-5) out.set(1, 0, 0);
  out.normalize();
  const pts = [];
  const n = 4;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push(new T.Vector3(
      start.x + out.x * len * 0.35 * Math.sin(t * 1.1) + (r() - 0.5) * 0.1,
      start.y + len * 0.10 * Math.sin(t * 2.2) - len * Math.pow(t, 1.4) * 0.92,
      start.z + out.z * len * 0.35 * Math.sin(t * 1.1) + (r() - 0.5) * 0.1
    ));
  }
  WEEP_BRANCHES.push({ pts, r0: 0.035 * s, r1: 0.012 * s });
  for (let i = 1; i <= n; i++) {
    const p = pts[i];
    addCluster(p, 0.30 * s * (0.8 + r() * 0.4), new T.Vector3(out.x * 0.3, -1, out.z * 0.3), swayV * (1 + i * 0.25), r);
  }
}
const WEEP_BRANCHES = [];

/* ---------- 建立树木 ---------- */
function plantTrees() {
  const configs = [
    { x: -8.6, z: 1.2, scale: 1.26, seed: 101, depth: 4, leafR: 0.70, leanX: 0.16, leanZ: 0.10, upBias: 0.14 },
    { x: 3.6, z: -9.6, scale: 1.06, seed: 202, depth: 4, leafR: 0.66, leanX: -0.12, leanZ: 0.08, upBias: 0.16 },
    { x: 9.2, z: -3.4, scale: 0.76, seed: 303, depth: 3, leafR: 0.62, leanX: -0.2, leanZ: -0.1, upBias: 0.2 },
  ];
  configs.forEach((c) => buildSakura(c));

  // 垂枝櫻（单独处理，便于加花串）
  RNG = mulberry32(404);
  const r = RNG;
  const wx = -9.6, wz = -6.4, ws = 1.05;
  const baseY = groundH(wx, wz);
  const br = [];
  function wgrow(start, dir, len, rad, depth, swayV) {
    const pts = [];
    for (let i = 0; i <= 4; i++) {
      const t = i / 4;
      pts.push(start.clone().addScaledVector(dir, len * t).add(new T.Vector3(0, -len * 0.10 * t * t, 0)));
    }
    br.push({ pts, r0: rad, r1: rad * 0.6 });
    const end = pts[4];
    const ed = pts[4].clone().sub(pts[3]).normalize();
    if (depth >= 2) {
      const n = 3;
      for (let i = 0; i < n; i++) {
        const a = r() * TAU, rr = 0.5 + r() * 0.8;
        addWeepStrand(
          end.clone().add(new T.Vector3(Math.cos(a) * rr, 0, Math.sin(a) * rr)),
          ed, (1.1 + r() * 0.9) * ws, swayV, r, ws
        );
      }
    }
    if (depth >= 3) return;
    const kids = depth === 0 ? 4 : 2;
    for (let i = 0; i < kids; i++) {
      const roll = (i / kids) * TAU + r() * 0.8;
      const up = new T.Vector3(0, 1, 0);
      let side = new T.Vector3().crossVectors(ed, up).normalize();
      const fwd = new T.Vector3().crossVectors(side, ed).normalize();
      const axis = side.clone().multiplyScalar(Math.cos(roll)).addScaledVector(fwd, Math.sin(roll)).normalize();
      const nd = ed.clone().applyAxisAngle(axis, 0.5 + r() * 0.35);
      nd.y += 0.12;
      nd.normalize();
      wgrow(depth === 0 ? pts[1 + Math.floor(r() * 2)] : end, nd, len * 0.72, rad * 0.62, depth + 1, swayV + 0.2);
    }
  }
  wgrow(new T.Vector3(wx, baseY - 0.05, wz), new T.Vector3(0.18, 1, 0.1).normalize(), 2.4 * ws, 0.26 * ws, 0, 0);
  const wgeo = mergeBranches(br.concat(WEEP_BRANCHES), baseY, r() * TAU);
  const wMat = new T.MeshStandardMaterial({ color: new T.Color('#7a5361'), roughness: 0.92, flatShading: true });
  windifyFoliage(wMat, 0.5);
  const wmesh = new T.Mesh(wgeo, wMat);
  wmesh.castShadow = true; wmesh.receiveShadow = true;
  const wgrp = new T.Group();
  wgrp.add(wmesh);
  scene.add(wgrp);
  TREE_SPOTS.push({ x: wx, z: wz, s: ws });
  addExclude(wx, wz, 0.9 * ws);
}

/* ---------- 叶团网格 ---------- */
function buildFoliageMesh() {
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(leafVerts.pos, 3));
  g.setAttribute('normal', new T.Float32BufferAttribute(leafVerts.nrm, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(leafVerts.uv, 2));
  g.setAttribute('aSway', new T.Float32BufferAttribute(leafVerts.sway, 1));
  g.setAttribute('aPhase', new T.Float32BufferAttribute(leafVerts.phase, 1));
  g.setAttribute('color', new T.Float32BufferAttribute(leafVerts.col, 3));
  g.setIndex(leafVerts.idx);
  const norm = g.attributes.normal;
  for (let i = 0; i < norm.count; i++) {

    map: TEX.blossom, color: new T.Color(PAL.blossom),
    alphaTest: 0.42, side: T.DoubleSide, roughness: 0.88, metalness: 0.0, vertexColors: true,
    emissive: new T.Color('#ff9dbe'), emissiveIntensity: 0.10,
  });
  windifyFoliage(mat, 1.0);
  const mesh = new T.Mesh(g, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = false;
  mesh.frustumCulled = false;

/* ---------------------------------------------------------------- *
 *  F1. 小岛
 * ---------------------------------------------------------------- */
function buildMiniIsland(cx, cy, cz, R, seed, opts) {
  opts = opts || {};
  const r = mulberry32(seed);
  const grp = new T.Group();
  grp.position.set(cx, cy, cz);

  const near = (x, z) => {
    const a = Math.atan2(z, x);
    return R * (1 + 0.10 * Math.sin(a * 3 + seed) + 0.06 * Math.sin(a * 5.5 - seed * 2));
  };
  const hgt = (x, z) => {
    const d = Math.hypot(x, z) / near(x, z);
    let h = (fbm(x * 0.28 + seed, z * 0.28 - seed, 3, 7) - 0.5) * 0.55 * R;
    h += 0.16 * R * Math.exp(-(x * x + z * z) / (R * R * 0.6));
    h -= Math.pow(smoothstep(0.42, 1.0, d), 1.7) * 1.05 * R;
    return h;
  };

  /* 顶面 */
  const rows = 13, cols = 40;
  const pos = [], uv = [], idx = [];
  pos.push(0, hgt(0, 0), 0); uv.push(0.5, 0.5);
  for (let j = 0; j < rows; j++) {
    const rt = Math.pow((j + 1) / rows, 0.9);
    for (let i = 0; i <= cols; i++) {
      const a = (i / cols) * TAU;
      const R2 = near(Math.cos(a), Math.sin(a));
      const rad = rt * R2;
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      pos.push(x, hgt(x, z), z);
      uv.push(x / (2 * R) + 0.5, z / (2 * R) + 0.5);
    }
  }
  const c = cols + 1;
  for (let i = 0; i < cols; i++) idx.push(0, 1 + i + 1, 1 + i);
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols; i++) {
      const a = 1 + j * c + i, b = a + 1, d = a + c, e = d + 1;
      idx.push(a, b, d, b, e, d);
    }
  }
  const tg = new T.BufferGeometry();
  tg.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  tg.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  tg.setIndex(idx);
  tg.computeVertexNormals();

  const gt = TEX.ground.clone();
  gt.needsUpdate = true;
  gt.offset.set(r(), r());
  gt.repeat.set(0.42, 0.42);
  const groundMat = new T.MeshStandardMaterial({
    map: gt, bumpMap: gt, bumpScale: 0.02, roughness: 0.95, metalness: 0,
    color: new T.Color('#ffe9f1'),
  });
  const top = new T.Mesh(tg, groundMat);
  top.receiveShadow = true;
  grp.add(top);

  /* 岩体 */
  const rrows = 9, rcols = 34;
  const rp = [], ri = [], rc = [];
  const cTop = new T.Color('#d6b0be'), cDeep = new T.Color('#8d6675');
  for (let j = 0; j < rrows; j++) {
    const t = j / (rrows - 1);
    for (let i = 0; i <= rcols; i++) {
      const a = (i / rcols) * TAU;
      const R2 = near(Math.cos(a), Math.sin(a));
      const shrink = Math.pow(clamp(1 - Math.pow(t, 0.48), 0, 1), 0.62) * (1 + 0.16 * Math.sin(t * 6.0 + seed));
      const bump = 1 + 0.34 * (fbm(Math.cos(a) * 2.2 + seed, t * 3.1, 3, 91) - 0.5);
      const rad = R2 * shrink * bump;
      const y = -Math.pow(t, 0.85) * R * (1.45 + 0.35 * Math.sin(seed)) - 0.05 * R;
      rp.push(Math.cos(a) * rad, y, Math.sin(a) * rad);
      const col = cTop.clone().lerp(cDeep, Math.pow(t, 0.6));
      rc.push(col.r, col.g, col.b);
    }
  }
  // 索引（rcols+1 列）
  const rc2 = rcols + 1;
  for (let j = 0; j < rrows - 1; j++) {
    for (let i = 0; i < rcols; i++) {
      const a = j * rc2 + i, b = a + 1, d = a + rc2, e = d + 1;
      ri.push(a, b, d, b, e, d);
    }
  }
  const rg = new T.BufferGeometry();
  rg.setAttribute('position', new T.Float32BufferAttribute(rp, 3));
  rg.setAttribute('color', new T.Float32BufferAttribute(rc, 3));
  rg.setIndex(ri);
  rg.computeVertexNormals();
  const rock = new T.Mesh(rg, new T.MeshStandardMaterial({
    vertexColors: true, roughness: 0.97, flatShading: true, side: T.DoubleSide,
  }));
  rock.castShadow = true; rock.receiveShadow = true;
  grp.add(rock);

  scene.add(grp);

  /* 草 */
  if (opts.grass !== false) {
    const tufts = [];
    for (let i = 0; i < 250; i++) {
      const a = r() * TAU, rr = Math.sqrt(r()) * R * 0.86;
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
      tufts.push({ x, z, h: 0.08 + Math.pow(r(), 1.5) * 0.22, yaw: r() * TAU, ph: r() * TAU });
    }
    const geo = makeTuftGeo(6, 4, 3131);
    const mesh = new T.InstancedMesh(geo, grassMat, tufts.length);
    const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), sc = new T.Vector3(), pv = new T.Vector3();
    const rotArr = new Float32Array(tufts.length), phArr = new Float32Array(tufts.length);
    const col = new T.Color();
    tufts.forEach((tt, i) => {
      pv.set(tt.x, hgt(tt.x, tt.z) - 0.02, tt.z);
      e.set(0, tt.yaw, 0, 'YXZ');
      q.setFromEuler(e);
      const w = 0.6 + tt.h * 0.55;
      sc.set(w, tt.h, w);
      m4.compose(pv, q, sc);
      mesh.setMatrixAt(i, m4);
      rotArr[i] = tt.yaw; phArr[i] = tt.ph;
      const tone = 0.8 + r() * 0.35;
      col.setRGB(tone, tone, tone);
      mesh.setColorAt(i, col);
    });
    geo.setAttribute('aRot', new T.InstancedBufferAttribute(rotArr, 1));
    geo.setAttribute('aPhase', new T.InstancedBufferAttribute(phArr, 1));
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = false; mesh.receiveShadow = true; mesh.frustumCulled = false;
    grp.add(mesh);
  }

  /* 小樱树 */
  if (opts.tree) {
    buildSakura({
      x: cx + rnd(-0.3, 0.3) * R, z: cz + rnd(-0.3, 0.3) * R, baseY: cy + hgt(0, 0) - 0.05,
      scale: opts.tree, seed: seed + 77, depth: 4, leafR: 1.35,
      leanX: rnd(-0.15, 0.15), leanZ: rnd(-0.15, 0.15), upBias: 0.2,
    });
  }
  /* 小石灯笼 */
  if (opts.lantern) {
    const L = buildLantern(cx + R * 0.35, cz - R * 0.2, 0.55, r() * TAU);
    L.group.position.set(cx + R * 0.35, cy + hgt(R * 0.35, -R * 0.2) - 0.02, cz - R * 0.2);
  }

  return { grp, R, cx, cy, cz, hgt };
}

/* ---------------------------------------------------------------- *
 *  F2. 锁链工具
 * ---------------------------------------------------------------- */
function chainMatrices(curve, spacing, scl) {
  const len = curve.getLength();
  const n = Math.max(3, Math.round(len / spacing));
  const out = [];
  const up = new T.Vector3(0, 1, 0);
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    let side = new T.Vector3().crossVectors(tan, up);
    if (side.lengthSq() < 1e-4) side.set(1, 0, 0);
    side.normalize();
    const nrm = new T.Vector3().crossVectors(side, tan).normalize();
    const flip = i % 2 ? 1 : -1;
    const yAx = (flip > 0 ? nrm : side).clone().multiplyScalar(scl);
    const zAx = (flip > 0 ? side : nrm).clone().multiplyScalar(scl);
    const m = new T.Matrix4();
    m.makeBasis(tan.clone().multiplyScalar(scl), yAx, zAx);
    m.setPosition(p);
    out.push(m);
  }
  return out;
}

/* 岩体在给定高度 / 方位上的真实半径：查 b.js 生成的表面采样 */
function rockRadiusAt(a, y) {
  let best = 0;
  for (let i = 0; i < ROCK_POINTS.length; i++) {
    const p = ROCK_POINTS[i];
    if (p.r <= best) continue;
    let da = Math.abs(p.a - a);
    if (da > Math.PI) da = TAU - da;
    if (da > 0.14) continue;
    if (Math.abs(p.y - y) > 0.85) continue;
    best = p.r;
  }
  if (best > 0) return best;
  // 兜底估算
  const t = Math.pow(Math.max(0, (0.8 - y)) / 19.5, 1 / 0.92);
  const shrink = Math.pow(clamp(1 - Math.pow(clamp(t, 0, 1), 0.62), 0, 1), 0.72);
  return islandRadius(a) * shrink;
}

/* 螺旋束链：绕岩体多圈 */
function helixCoil(y0, y1, turns, phase, extraR) {
  const N = 190;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const ang = phase + s * turns * TAU;
    const y = y0 + (y1 - y0) * s + Math.sin(s * 5.0 + phase * 2) * 0.10;
    const r = rockRadiusAt(ang, y) + (extraR || 0.22);
    pts.push(new T.Vector3(Math.cos(ang) * r, y, Math.sin(ang) * r));
  }
  return new T.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
}

/* ------------- 魔法能量材质 ------------- */
const CHAIN_MATS = {
  uTime: { value: 0 },
  uPow: { value: 1.0 },
  uColA: { value: new T.Color('#ff8fd0') },
  uColB: { value: new T.Color('#b98cff') },
  uColC: { value: new T.Color('#ffffff') },
};

const chainCoreMat = new T.ShaderMaterial({
  uniforms: CHAIN_MATS,
  transparent: true,
  blending: T.AdditiveBlending,
  depthWrite: false,
  side: T.DoubleSide,
  vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position,1.0);
      vN = normalize(mat3(modelMatrix) * normal);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime,uPow; uniform vec3 uColA,uColB,uColC;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float t = vUv.y;
      // 三个不同速度的流动脉冲
      float p1 = pow(fract(t * 2.2 - uTime * 0.22), 7.0);
      float p2 = pow(fract(t * 1.1 - uTime * 0.12 + 0.37), 9.0);
      float p3 = pow(fract(t * 5.0 - uTime * 0.38 + 0.71), 12.0);
      float ripple = 0.5 + 0.5 * sin(t * 210.0 - uTime * 7.0);
      // 符文带
      float rune = smoothstep(0.55, 0.95, fract(t * 52.0 - uTime * 0.5));
      float fres = pow(abs(dot(normalize(vN), normalize(vV))), 0.6);
      float a = (0.14 + p1 * 1.5 + p2 * 1.2 + p3 * 1.6 + ripple * 0.14 + rune * 0.55) * uPow * (0.55 + 0.65 * fres);
      vec3 c = mix(uColA, uColB, clamp(p1 + p2, 0.0, 1.0));
      c = mix(c, uColC, clamp(p3 + rune * 0.7, 0.0, 1.0));
      gl_FragColor = vec4(c, clamp(a, 0.0, 1.0));
    }`,
});

const chainGlowMat = new T.ShaderMaterial({
  uniforms: CHAIN_MATS,
  transparent: true,
  blending: T.AdditiveBlending,
  depthWrite: false,
  side: T.DoubleSide,
  vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position,1.0);
      vN = normalize(mat3(modelMatrix) * normal);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime,uPow; uniform vec3 uColA,uColB,uColC;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float t = vUv.y;
      float p1 = pow(fract(t * 2.2 - uTime * 0.22), 3.0);
      float pulse = 0.22 + p1 * 0.9;
      float fres = 1.0 - abs(dot(normalize(vN), normalize(vV)));
      float a = pulse * (0.30 + fres * 0.85) * uPow;
      vec3 c = mix(uColA, uColB, p1 * 0.7);
      gl_FragColor = vec4(c, clamp(a, 0.0, 1.0));
    }`,
});

const chainLinkGeo = (() => {
  const g = new T.TorusGeometry(0.21, 0.078, 6, 12);
  g.scale(1.0, 1.55, 1.0);
  return g;
})();
const chainMat = new T.MeshStandardMaterial({
  color: new T.Color('#5d4854'), roughness: 0.32, metalness: 0.78,
  emissive: new T.Color('#ff5fae'), emissiveIntensity: 0.26,

/* ---------------------------------------------------------------- *
 *  F3. 副岛（270° 均匀分布，每座都有樱树）

const D2R = Math.PI / 180;
const SUB_DEFS = [
  { a: 171 * D2R, dist: 46.0, y: 7.5, R: 3.2, seed: 11, tree: 0.62, lantern: true },
  { a: 261 * D2R, dist: 44.0, y: -2.0, R: 2.9, seed: 23, tree: 0.58, lantern: false },

/* 主叶冠网格已在 C 段生成，副岛树的叶片需要单独建一份 */
(function buildSubFoliage(vStart) {
  if (leafVerts.pos.length <= vStart * 3) return;
  const pos = leafVerts.pos.slice(vStart * 3);
  const nrm = leafVerts.nrm.slice(vStart * 3);
  const uv = leafVerts.uv.slice(vStart * 2);

  g.setAttribute('aPhase', new T.Float32BufferAttribute(ph, 1));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));

  const norm = g.attributes.normal;
  for (let i = 0; i < norm.count; i++) {

/* ---------------------------------------------------------------- *
 *  F4. 束链：岩体螺旋缠绕 + 副岛悬链
 * ---------------------------------------------------------------- */
const CHAIN_GROUP = new T.Group();
scene.add(CHAIN_GROUP);

const chainCurves = [];
function addChain(curve, spacing, scl, tubeR, glowR) {
  chainCurves.push({ curve, tubeR: tubeR === undefined ? 0.06 : tubeR, glowR: glowR === undefined ? 0.22 : glowR });
  return chainMatrices(curve, spacing, scl);
}

let allMatrices = [];

/* 两道螺旋，把岛体下部缠满 */
const coilA = helixCoil(-1.5, -8.6, 2.8, 0.4, 0.24);
const coilB = helixCoil(-6.6, -13.4, 1.8, 2.1, 0.20);
allMatrices = allMatrices.concat(addChain(coilA, 0.50, 1.42, 0.055, 0.16));
allMatrices = allMatrices.concat(addChain(coilB, 0.56, 1.34, 0.050, 0.14));

/* 副岛悬链 + 封印 */
const SEALS = [];
subIslands.forEach((si) => {
  const d = si.def;
  const a = d.a;
  const rimR = islandRadius(a) * 0.965;
  const ay = groundH(Math.cos(a) * rimR, Math.sin(a) * rimR) - 0.12;
  const anchor = new T.Vector3(Math.cos(a) * rimR, ay, Math.sin(a) * rimR);
  const subAnchor = new T.Vector3(
    si.cx - Math.cos(a) * si.R * 0.78,
    si.cy - 0.25,
    si.cz - Math.sin(a) * si.R * 0.78
  );
  const dir = subAnchor.clone().sub(anchor);
  const dLen = dir.length();
  const pts = [anchor.clone()];
  const segs = 4;
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const p = anchor.clone().lerp(subAnchor, t);
    p.y -= Math.sin(t * Math.PI) * Math.min(3.2, dLen * 0.10);
    pts.push(p);
  }
  pts.push(subAnchor);
  const curve = new T.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  allMatrices = allMatrices.concat(addChain(curve, Math.max(0.42, curve.getLength() / 150), 1.46, 0.056, 0.16));

  // 草地上的封印法阵
  const sealGrp = new T.Group();
  sealGrp.position.copy(anchor).add(new T.Vector3(0, 0.06, 0));
  sealGrp.rotation.set(-Math.PI / 2, 0, rnd(0, TAU));
  const ringMat = new T.MeshBasicMaterial({
    color: 0xff9ed6, transparent: true, opacity: 0.8,
    blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide,
  });
  const ring1 = new T.Mesh(new T.TorusGeometry(0.72, 0.032, 6, 44), ringMat);
  sealGrp.add(ring1);
  const ring2 = new T.Mesh(new T.TorusGeometry(0.44, 0.020, 6, 30), ringMat.clone());
  ring2.material.opacity = 0.55;
  sealGrp.add(ring2);
  for (let i = 0; i < 8; i++) {
    const a2 = (i / 8) * TAU;
    const tick = new T.Mesh(new T.PlaneGeometry(0.12, 0.30), ringMat.clone());
    tick.material.opacity = 0.9;
    tick.position.set(Math.cos(a2) * 0.72, Math.sin(a2) * 0.72, 0);
    tick.rotation.z = a2 + Math.PI / 2;
    sealGrp.add(tick);
  }
  const glow = new T.Sprite(new T.SpriteMaterial({
    map: TEX.glow, color: 0xffb6e0, transparent: true, opacity: 0.55,
    blending: T.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(5.0, 5.0, 1);
  sealGrp.add(glow);
  CHAIN_GROUP.add(sealGrp);
  SEALS.push({ grp: sealGrp, ring1, ring2, glow });

const SPARK_N = 460;

const sparkState = [];
for (let i = 0; i < SPARK_N; i++) {
  sparkState.push({
    c: Math.floor(RNG() * SPARK_LUT.length),
    u: RNG(),
    sp: 0.045 + RNG() * 0.16,
    off: new T.Vector3((RNG() - 0.5) * 0.18, (RNG() - 0.5) * 0.18, (RNG() - 0.5) * 0.18),
    ph: RNG() * TAU,

const _sv = new T.Vector3();
function updateChainVFX(t, dt) {
  CHAIN_MATS.uTime.value = t;
  CHAIN_MATS.uPow.value = 1.05 + Math.sin(t * 1.6) * 0.18;
  chainMat.emissiveIntensity = 0.22 + Math.abs(Math.sin(t * 1.3)) * 0.24;
  for (let i = 0; i < SPARK_N; i++) {
    const s = sparkState[i];
    s.u += s.sp * dt;
    if (s.u > 1) { s.u -= 1; s.c = Math.floor(Math.random() * SPARK_LUT.length); }
    const lut = SPARK_LUT[s.c];
    const f = s.u * (lut.length - 1);
    const i0 = Math.floor(f), i1 = Math.min(lut.length - 1, i0 + 1);
    const k = f - i0;
    _sv.copy(lut[i0]).lerp(lut[i1], k);
    sparkPos[i * 3] = _sv.x + s.off.x + Math.sin(t * 3 + s.ph) * 0.05;
    sparkPos[i * 3 + 1] = _sv.y + s.off.y + Math.cos(t * 2.4 + s.ph) * 0.05;
    sparkPos[i * 3 + 2] = _sv.z + s.off.z + Math.sin(t * 2.8 + s.ph * 1.7) * 0.05;
    const b = 0.55 + 0.45 * Math.sin(t * 6 + s.ph * 3);
    sparkCol[i * 3] = 1.0 * b;
    sparkCol[i * 3 + 1] = 0.68 * b;
    sparkCol[i * 3 + 2] = 0.92 * b;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.color.needsUpdate = true;
}

   G. 背景音乐：播放真实音频文件（同目录自动探测 / 选文件 / 拖拽）
   ========================================================================= */
const BGM = (function () {
  const el = new Audio();
  el.loop = true;
  el.preload = 'auto';
  let volume = 0.45;
  let loaded = false;
  let trackName = '';
  let objectUrl = null;
  let probeIndex = 0;
  el.volume = volume;

  /* 同目录自动探测：把曲子命名为 bgm.mp3 放进来即可 */
  const CANDIDATES = ['bgm.mp3', 'bgm.ogg', 'bgm.m4a', 'bgm.wav', 'bgm.flac'];

  function markLoaded(name) {
    loaded = true;
    trackName = name;
    el.title = name;
  }

  /* 轮询探测：不依赖事件时序（首屏构建会长时间阻塞主线程） */
  function probe() {
    const name = CANDIDATES[probeIndex];
    if (!name) { loaded = false; return; }
    el.src = name;
    el.load();
    let ticks = 0;
    const timer = setInterval(() => {
      ticks++;
      if (el.duration > 0 && el.readyState >= 1) {
        clearInterval(timer);
        markLoaded(name);
        return;
      }
      if (el.error) {
        clearInterval(timer);
        probeIndex++;
        probe();
        return;
      }
      if (ticks > 80) {
        clearInterval(timer);
        probeIndex++;
        probe();
      }
    }, 250);
  }

  function setVolume(v) {
    volume = clamp(v, 0, 1);
    el.volume = volume;
  }
  function play() {
    if (!loaded) return Promise.resolve(false);
    return el.play().then(() => true).catch(() => false);
  }
  function pause() { el.pause(); }
  function toggle() {
    if (!loaded) return Promise.resolve(false);
    if (el.paused) return play();
    pause();
    return Promise.resolve(false);
  }
  function loadFile(file) {
    if (!file) return;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    el.src = objectUrl;
    el.load();
    loaded = true;
    trackName = file.name;
    el.title = file.name;
    el.play().catch(() => {});
  }

  probe();

  /* 场景构建会阻塞主线程，可能错过首个事件；空闲后再试一次 */
  function reprobe() { if (loaded) return; probeIndex = 0; probe(); }

  return {
    el, setVolume, play, pause, toggle, loadFile, reprobe,
    get playing() { return loaded && !el.paused; },
    get loaded() { return loaded; },
    get name() { return trackName; },
  };
})();

function buildClouds() {
  const r = mulberry32(31337);
  const mats = [0.18, 0.26, 0.36, 0.48].map((o) => new T.SpriteMaterial({
    map: TEX.cloud, transparent: true, opacity: o, depthWrite: false, fog: true, color: 0xffffff,
  }));
  const grp = new T.Group();
  const items = [];
  for (let i = 0; i < 15; i++) {
    const a = r() * TAU;
    const rad = 62 + Math.pow(r(), 0.7) * 95;
    const y = -26 + r() * 46;
    const cl = new T.Group();
    cl.position.set(Math.cos(a) * rad, y, Math.sin(a) * rad);
    const n = 3 + Math.floor(r() * 4);
    for (let j = 0; j < n; j++) {
      const sp = new T.Sprite(mats[Math.floor(r() * mats.length)]);
      const s = 12 + r() * 20;
      sp.scale.set(s, s * 0.58, 1);
      sp.position.set((r() - 0.5) * s * 1.15, (r() - 0.5) * s * 0.20, (r() - 0.5) * s * 0.7);
      cl.add(sp);
    }
    grp.add(cl);
    items.push({ cl, y, ph: r() * TAU, amp: 0.35 + r() * 0.9 });
  }
  // 若干中景云，增加层次
  for (let i = 0; i < 9; i++) {
    const a = r() * TAU;
    const rad = 42 + r() * 30;
    const y = -14 + r() * 26;
    const cl = new T.Group();
    cl.position.set(Math.cos(a) * rad, y, Math.sin(a) * rad);
    for (let j = 0; j < 2; j++) {
      const sp = new T.Sprite(mats[0]);
      const s = 6 + r() * 10;
      sp.scale.set(s, s * 0.52, 1);
      sp.position.set((r() - 0.5) * s, (r() - 0.5) * s * 0.2, (r() - 0.5) * s * 0.5);
      cl.add(sp);
    }
    grp.add(cl);
    items.push({ cl, y, ph: r() * TAU, amp: 0.2 + r() * 0.5 });
  }
  // 低空云海
  const seaTex = TEX.cloud.clone();
  seaTex.needsUpdate = true;
  seaTex.wrapS = seaTex.wrapT = T.RepeatWrapping;
  seaTex.repeat.set(24, 24);
  const seaMat = new T.MeshBasicMaterial({
    map: seaTex, transparent: true, opacity: 0.13, depthWrite: false, fog: true,
    color: 0xffffff, side: T.DoubleSide,
  });
  const sea = new T.Mesh(new T.PlaneGeometry(1500, 1500, 1, 1), seaMat);
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = -42;
  grp.add(sea);
  const seaMat2 = seaMat.clone();
  seaMat2.opacity = 0.08;
  const sea2 = new T.Mesh(new T.PlaneGeometry(1100, 1100, 1, 1), seaMat2);
  sea2.rotation.x = -Math.PI / 2;
  sea2.position.y = -34;
  grp.add(sea2);
  return { grp, mats, items, seaMat, seaMat2, seaTex };
}

  auto: true, dragging: false, idle: 0,
};
const dom = renderer.domElement;
let lastX = 0, lastY = 0, pointers = new Map(), pinchDist = 0;

function onDown(e) {
  dom.setPointerCapture && dom.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  ctrl.dragging = true; ctrl.idle = 0;
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
}
function onMove(e) {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchDist > 0) {
      ctrl.tRadius = clamp(ctrl.tRadius * (pinchDist / d), 17, 82);
    }
    pinchDist = d;
    return;
  }
  ctrl.tTheta -= dx * 0.0055;
  ctrl.tPhi = clamp(ctrl.tPhi - dy * 0.0042, 0.20, 1.62);
  ctrl.idle = 0;
}
function onUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) ctrl.dragging = false;
  pinchDist = 0;
}
dom.addEventListener('pointerdown', onDown);

});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && /^audio\//.test(f.type)) { BGM.loadFile(f); setTimeout(updateMusicUI, 400); }
});
updateMusicUI();
setInterval(updateMusicUI, 1000);
setTimeout(() => { if (!BGM.loaded) BGM.reprobe(); }, 1800);
setTimeout(updateMusicUI, 2600);

function kickMusic(e) {
  if (e.target && e.target.closest && e.target.closest('#hud')) return;
  window.removeEventListener('pointerdown', kickMusic);
  if (BGM.loaded && !BGM.playing) BGM.play().then(updateMusicUI);
}
window.addEventListener('pointerdown', kickMusic);

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  ctrl.auto = !ctrl.auto;
  btnOrbit.classList.toggle('on', ctrl.auto);
});
petals.mesh.count = 420;
let petalBoost = false;
const btnPetal = document.getElementById('btnPetal');
btnPetal.addEventListener('click', () => {
  petalBoost = !petalBoost;
  btnPetal.classList.toggle('on', petalBoost);
  petals.mesh.count = petalBoost ? petals.items.length : 420;
});

/* ---------------------------------------------------------------- *
 *  E6. 自适应
 * ---------------------------------------------------------------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
}
window.addEventListener('resize', resize);

/* ---------------------------------------------------------------- *
 *  E7. 主循环
 * ---------------------------------------------------------------- */
const clock = new T.Clock();
const tmpM = new T.Matrix4();
const tmpQ = new T.Quaternion();
const tmpE = new T.Euler();
const tmpV = new T.Vector3();
const tmpS = new T.Vector3();

function updatePetals(dt, t) {
  const list = petals.items;
  const wd = sharedUniforms.uWindDir.value;
  const wind = windState.cur;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const swirl = Math.sin(t * 1.9 + p.ph) * (0.45 + wind * 1.4);
    p.x += (p.vx + wd.x * (0.6 + wind * 2.6) + swirl * 0.5) * dt;
    p.z += (p.vz + wd.y * (0.6 + wind * 2.6) + Math.cos(t * 1.5 + p.ph) * 0.4) * dt;
    p.y -= p.vy * (0.55 + wind * 0.7) * dt;
    p.rx += p.sx * dt * (0.6 + wind);
    p.ry += p.sy * dt * (0.6 + wind);
    p.rz += p.sz * dt * (0.6 + wind);
    if (p.y < p.floor || (p.x * p.x + p.z * p.z) > 400) {
      spawnPetal(p, false);
    }
    tmpV.set(p.x, p.y, p.z);
    tmpE.set(p.rx, p.ry, p.rz, 'XYZ');
    tmpQ.setFromEuler(tmpE);
    tmpS.setScalar(p.sc);
    tmpM.compose(tmpV, tmpQ, tmpS);
    petals.mesh.setMatrixAt(i, tmpM);
  }
  petals.mesh.instanceMatrix.needsUpdate = true;
}

let started = false;
function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.048);
  const t = clock.elapsedTime;

  sharedUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  skyUniforms.uSkyWind.value = 0.62 + Math.sin(t * 0.05) * 0.25;
  updateChainVFX(t, dt);
  SEALS.forEach((sl, i) => {
    sl.ring1.rotation.z = t * 0.35 + i;
    sl.ring2.rotation.z = -t * 0.55 + i * 2;
    sl.glow.material.opacity = 0.30 + 0.18 * Math.sin(t * 1.7 + i);
  });

  // 风
  windState.cur += (windState.target - windState.cur) * Math.min(1, dt * 2.2);
  sharedUniforms.uWind.value = windState.cur;
  const wa = 0.62 + Math.sin(t * 0.06) * 0.22;
  sharedUniforms.uWindDir.value.set(Math.cos(wa), Math.sin(wa));
  beamUniforms.uTime.value = t;
  updateBeamOrientation();

  updateEnvironment(Math.min(rawDt, 0.25));
  updatePetals(dt, t);

  // 碎石漂浮
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    f.m.position.y = f.y0 + Math.sin(t * f.sp + f.ph) * f.amp;
    f.m.rotation.y += f.rot * dt;
    f.m.rotation.x += f.rot * 0.6 * dt;
  }

  // 云漂移
  clouds.grp.rotation.y += dt * (0.010 + windState.cur * 0.075);
  for (let i = 0; i < clouds.items.length; i++) {
    const c = clouds.items[i];
    c.cl.position.y = c.y + Math.sin(t * 0.12 + c.ph) * c.amp;
  }
  dust.rotation.y += dt * 0.012;
  motes.rotation.y -= dt * 0.02;

  // 灯焰微跳
  const flick = 0.86 + Math.sin(t * 9.3) * 0.06 + Math.sin(t * 21.7) * 0.04;
  lanternLights.forEach((l) => { l.intensity = LIVE.lantern * 1.6 * flick; });
  M.lanternGlow.emissiveIntensity = LIVE.lantern * 0.9 * flick;

  // 相机
  if (ctrl.auto && !ctrl.dragging) {
    ctrl.idle += dt;
    if (ctrl.idle > 1.6) ctrl.tTheta += dt * 0.045;
  }
  ctrl.theta += (ctrl.tTheta - ctrl.theta) * Math.min(1, dt * 6.5);
  ctrl.phi += (ctrl.tPhi - ctrl.phi) * Math.min(1, dt * 6.5);
  ctrl.radius += (ctrl.tRadius - ctrl.radius) * Math.min(1, dt * 5.0);
  const sp = Math.sin(ctrl.phi), cp = Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * sp * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * cp,
    ctrl.target.z + ctrl.radius * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  renderer.render(scene, camera);

  if (!started) {
    started = true;
    const boot = document.getElementById('boot');
    boot.classList.add('gone');
    setTimeout(() => { boot.style.display = 'none'; }, 1400);
  }
}

/* ---------------------------------------------------------------- *
 *  E8. 启动
 * ---------------------------------------------------------------- */
applyPreset('day', true);
resize();
window.__DBG = { renderer: renderer, scene: scene, camera: camera, ctrl: ctrl, LIVE: LIVE, T: T, applyPreset: applyPreset, BGM: BGM, buildMs: Math.round(performance.now()) };
window.BGM = BGM;
camera.position.set(24, 18, 22);
animate();

})();
</script>
